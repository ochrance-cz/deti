name: deploy to production

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # Production deploys from the office's public repository; the manGoweb
    # working copy only prepares changes.
    if: github.repository == 'ochrance-cz/deti'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify published URLs
        run: bun run verify:launch

      # Static assets are uploaded by content hash, so only changed files travel.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc
