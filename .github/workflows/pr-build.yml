name: PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run verify:launch
      - run: bun run verify:r2
      - run: bun run verify:pages
      - run: bun run verify:photos
